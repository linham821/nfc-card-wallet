name: Build iOS IPA

# 触发条件：
#   1. push 到 main/master 分支时自动构建
#   2. 在 GitHub 网页手动触发（Actions → Run workflow）
#   3. Pull Request 时构建（可选）
on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14  # Apple Silicon, 预装 Xcode 15.x

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          cd ios/NFCCardWallet
          xcodegen generate

      - name: 编译未签名 .app
        run: |
          cd ios/NFCCardWallet
          mkdir -p ../../build/DerivedData
          xcodebuild build \
            -project NFCCardWallet.xcodeproj \
            -scheme NFCCardWallet \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: 打包为 .ipa
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "NFCCardWallet.app" -type d | head -1)
          echo "找到 .app: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -q -r "NFCCardWallet-unsigned.ipa" Payload/
          ls -lh NFCCardWallet-unsigned.ipa

      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFCCardWallet-unsigned-ipa
          path: build/ipa/NFCCardWallet-unsigned.ipa
          retention-days: 30  # 保留 30 天

      - name: 构建摘要
        run: |
          echo "## ✅ IPA 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "在页面下方 **Artifacts** 区域下载 \`NFCCardWallet-unsigned-ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "下载后用 [Sideloadly](https://sideloadly.io) + 免费 Apple ID 签名装到 iPhone" >> $GITHUB_STEP_SUMMARY
          echo "详见 \`scripts/sideload_guide.md\`" >> $GITHUB_STEP_SUMMARY
