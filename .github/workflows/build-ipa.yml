name: Build iOS IPA

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: 安装 XcodeGen 2.38.0（兼容 Xcode 15）
        run: |
          cd /tmp
          curl -sL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip"
          unzip -o xcodegen.zip
          chmod +x xcodegen/bin/xcodegen
          sudo cp xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          cd ios/NFCCardWallet
          xcodegen generate

      - name: 编译未签名 .app
        run: |
          cd ios/NFCCardWallet
          mkdir -p "$GITHUB_WORKSPACE/build/DerivedData"
          set -o pipefail
          xcodebuild build \
            -project NFCCardWallet.xcodeproj \
            -scheme NFCCardWallet \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log

      - name: 检查编译结果
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" -name "NFCCardWallet.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 编译失败，未找到 .app"
            echo "=== 编译错误摘要 ==="
            grep -E "error:|BUILD FAILED" "$GITHUB_WORKSPACE/ios/NFCCardWallet/build.log" | head -20 || true
            echo "=== 完整日志最后 50 行 ==="
            tail -50 "$GITHUB_WORKSPACE/ios/NFCCardWallet/build.log"
            exit 1
          fi
          echo "✅ 编译成功: $APP_PATH"

      - name: 打包为 .ipa
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" -name "NFCCardWallet.app" -type d | head -1)
          mkdir -p "$GITHUB_WORKSPACE/build/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/build/ipa"
          rm -f NFCCardWallet-unsigned.ipa
          zip -q -r "NFCCardWallet-unsigned.ipa" Payload/
          ls -lh NFCCardWallet-unsigned.ipa

      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFCCardWallet-unsigned-ipa
          path: build/ipa/NFCCardWallet-unsigned.ipa
          retention-days: 30

      - name: 构建摘要
        run: |
          echo "## ✅ IPA 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "在页面下方 **Artifacts** 区域下载 \`NFCCardWallet-unsigned-ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "下载后用 [Sideloadly](https://sideloadly.io) + 免费 Apple ID 签名装到 iPhone" >> $GITHUB_STEP_SUMMARY
